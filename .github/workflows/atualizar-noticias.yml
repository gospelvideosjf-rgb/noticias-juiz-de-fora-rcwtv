name: Atualizar Manchetes e Arquivo Permanente RCWTV

on:
  schedule:
    - cron: '0 11,21 * * *' # 08h e 18h no horário de Brasília (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar manchetes e histórico pelo RSS oficial
        run: |
          python3 <<'PY'
          from datetime import datetime
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          import xml.etree.ElementTree as ET

          feed_url = "https://www.rcwtv.com.br/rss.xml"
          request = Request(feed_url, headers={"User-Agent": "RCWTV-News-Archive/1.0"})
          with urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          def child_text(element, name):
              for child in element:
                  if child.tag.rsplit("}", 1)[-1] == name:
                      return (child.text or "").strip()
              return ""

          items = []
          for element in root.iter():
              if element.tag.rsplit("}", 1)[-1] != "item":
                  continue
              title = child_text(element, "title")
              link = child_text(element, "link")
              if title and link:
                  items.append((title, link))

          if not items:
              raise SystemExit("O RSS foi recebido, mas nenhum item válido foi encontrado.")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start_marker = "<!-- RCWTV_FEED_START -->"
          end_marker = "<!-- RCWTV_FEED_END -->"
          if start_marker not in readme or end_marker not in readme:
              raise SystemExit("Os marcadores do feed não foram encontrados no README.md.")

          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker, start)
          headlines = "\n" + "".join(
              f"- 📰 [{title}](<{link}>)\n" for title, link in items[:10]
          )
          readme_path.write_text(
              readme[:start] + headlines + readme[end:],
              encoding="utf-8",
          )

          history_path = Path("historico-noticias.md")
          if history_path.exists():
              history = history_path.read_text(encoding="utf-8")
          else:
              history = (
                  "# 📚 Arquivo Histórico Permanente de Notícias - RCWTV\n\n"
                  "Registro permanente e cumulativo de reportagens de Juiz de Fora "
                  "e Região mantido pela RCWTV Comunicação.\n\n"
                  "[Acesse o Portal Oficial RCWTV](https://www.rcwtv.com.br)\n\n---\n\n"
              )

          new_items = [(title, link) for title, link in items if link not in history]
          if new_items:
              today = datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%d/%m/%Y")
              history += f"### Atualização de {today}\n"
              history += "".join(
                  f"- [{title}](<{link}>) - *{today}*\n"
                  for title, link in new_items
              )
              history += "\n"
              history_path.write_text(history, encoding="utf-8")

          print(f"Manchetes atualizadas: {min(len(items), 10)}")
          print(f"Novas matérias arquivadas: {len(new_items)}")
          PY

      - name: Salvar alterações no repositório
        run: |
          git config user.name "RCWTV Bot"
          git config user.email "bot@rcwtv.com.br"
          git add README.md historico-noticias.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova."
          else
            git commit -m "Auto: atualização de manchetes e histórico permanente RCWTV"
            git push
          fi
