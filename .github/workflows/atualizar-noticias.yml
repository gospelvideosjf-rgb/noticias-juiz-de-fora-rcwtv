name: Atualizar Manchetes RCWTV

on:
  schedule:
    - cron: '0 11,21 * * *' # Roda automaticamente 2 vezes ao dia
  workflow_dispatch: # Permite rodar manualmente com 1 clique

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar RSS da RCWTV e Atualizar README
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          https.get('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.rcwtv.com.br/rss.xml'), (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              try {
                const json = JSON.parse(data);
                if (!json.items || json.items.length === 0) return;
                
                let list = '\n';
                json.items.slice(0, 10).forEach(item => {
                  list += '- 📰 [' + item.title + '](<' + item.link + '>)\n';
                });
                
                let readme = fs.readFileSync('README.md', 'utf8');
                const startMarker = '<!-- RCWTV_FEED_START -->';
                const endMarker = '<!-- RCWTV_FEED_END -->';
                const regex = new RegExp(startMarker + '[\\\s\\\S]*?' + endMarker, 'm');
                
                const updated = readme.replace(regex, startMarker + list + endMarker);
                fs.writeFileSync('README.md', updated);
                console.log('README atualizado com sucesso!');
              } catch(e) {
                console.error(e);
              }
            });
          }).on('error', (e) => console.error(e));
          "

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "RCWTV Bot"
          git config --global user.email "bot@rcwtv.com.br"
          git add README.md
          git commit -m "Auto: atualização das manchetes RCWTV" || echo "Sem novidades"
          git push
